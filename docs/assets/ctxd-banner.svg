<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">ctxd</title>
  <desc id="d">ctxd: one shared, private memory for every AI agent you use. Agents connect to a local ctxd server that replicates between your own Macs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)" opacity="0.55"/>

  <!-- Wordmark and tagline -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="150" font-size="96" font-weight="700" fill="#f8fafc">ctxd</text>
    <text x="78" y="196" font-size="18" fill="#7dd3fc" letter-spacing="2">SHARED CONTEXT FOR AI AGENTS</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#cbd5e1">
    <text x="78" y="244" font-size="21">One private memory for every AI agent you use.</text>
    <text x="78" y="276" font-size="21">Local-first, synced across your own Macs, never on the internet.</text>
  </g>

  <!-- Diagram: agents to the local core, core to replicas -->
  <g transform="translate(780 40)">
    <circle cx="190" cy="140" r="120" fill="url(#glow)"/>

    <g stroke="#334155" stroke-width="2" fill="none">
      <path d="M60 50 C120 60 150 110 170 128"/>
      <path d="M40 140 L160 140"/>
      <path d="M60 230 C120 220 150 170 170 152"/>
      <path d="M220 140 L330 70" stroke-dasharray="6 6" stroke="#475569"/>
      <path d="M220 140 L330 210" stroke-dasharray="6 6" stroke="#475569"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">
      <rect x="-14" y="30" width="116" height="34" rx="9" fill="#0f172a" stroke="#38bdf8"/>
      <text x="44" y="52">Claude Code</text>
      <rect x="-24" y="123" width="96" height="34" rx="9" fill="#0f172a" stroke="#38bdf8"/>
      <text x="24" y="145">Codex</text>
      <rect x="-14" y="216" width="116" height="34" rx="9" fill="#0f172a" stroke="#38bdf8"/>
      <text x="44" y="238">MCP clients</text>
    </g>

    <circle cx="195" cy="140" r="40" fill="url(#core)"/>
    <text x="195" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0b1220" text-anchor="middle">ctxd</text>
    <text x="195" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">127.0.0.1</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">
      <rect x="318" y="50" width="84" height="40" rx="8" fill="#0f172a" stroke="#6366f1"/>
      <text x="360" y="75">hub Mac</text>
      <rect x="318" y="190" width="84" height="40" rx="8" fill="#0f172a" stroke="#6366f1"/>
      <text x="360" y="215">laptop</text>
      <text x="360" y="146" fill="#64748b" font-size="11">tailnet only</text>
    </g>
  </g>
</svg>
